name: Halati Flutter CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "halati-${{ github.ref_name }}.apk"
      - name: Generate SHA-256
        run: sha256sum "halati-${{ github.ref_name }}.apk" | tee "halati-${{ github.ref_name }}.apk.sha256"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halati-release-apk
          path: |
            halati-${{ github.ref_name }}.apk
            halati-${{ github.ref_name }}.apk.sha256

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: halati-release-apk
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.sha256
