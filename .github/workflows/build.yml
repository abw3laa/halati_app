name: Halati Flutter CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HALATI_KEYSTORE_BASE64: ${{ secrets.HALATI_KEYSTORE_BASE64 }}
        run: |
          test -n "$HALATI_KEYSTORE_BASE64" || { echo "Missing HALATI_KEYSTORE_BASE64 GitHub secret"; exit 1; }
          echo "$HALATI_KEYSTORE_BASE64" | base64 --decode > android/halati-release.jks

      - name: Build release APK
        env:
          HALATI_KEYSTORE_PATH: ${{ github.workspace }}/android/halati-release.jks
          HALATI_KEYSTORE_PASSWORD: ${{ secrets.HALATI_KEYSTORE_PASSWORD }}
          HALATI_KEY_ALIAS: ${{ secrets.HALATI_KEY_ALIAS }}
          HALATI_KEY_PASSWORD: ${{ secrets.HALATI_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -n "$HALATI_KEYSTORE_PASSWORD" || { echo "Missing signing password secret"; exit 1; }
            test -n "$HALATI_KEY_ALIAS" || { echo "Missing signing alias secret"; exit 1; }
            test -n "$HALATI_KEY_PASSWORD" || { echo "Missing key password secret"; exit 1; }
          fi
          flutter build apk --release
      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^version: \\([0-9]\\+\\.[0-9]\\+\\.[0-9]\\+\\).*/\\1/p" pubspec.yaml)
          BUILD=$(sed -n "s/^version: [0-9]\\+\\.[0-9]\\+\\.[0-9]\\++\\([0-9]\\+\\).*/\\1/p" pubspec.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "halati-${{ steps.version.outputs.version }}.apk"
      - name: Generate SHA-256
        run: sha256sum "halati-${{ steps.version.outputs.version }}.apk" | tee "halati-${{ steps.version.outputs.version }}.apk.sha256"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: halati-release-apk
          path: |
            halati-${{ steps.version.outputs.version }}.apk
            halati-${{ steps.version.outputs.version }}.apk.sha256

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: halati-release-apk
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release/*.apk
            release/*.sha256
